controller_manager:
  ros__parameters:
    # [FLAG vbox-motion-controller-rate] Motion tests in VirtualBox do not need every auxiliary
    # controller active, and the logs show the guest still missing deadlines badly above this rate.
    # Keep the loop conservative first; smooth motion matters more than matching the vendor 1000 Hz.
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # [FLAG vbox-motion-status-rate] VBox motion already has a much slower and less deterministic
    # write cycle than bare metal. Keep controller-state publication modest so the guest spends less
    # time pushing status traffic while the arm is moving.
    state_publish_rate: 20.0
    action_monitor_rate: 10.0
    allow_partial_joints_goal: false
    constraints:
      # [FLAG vbox-motion-goal-check] The last VBox HOME run reported controller success even
      # though the arm visibly stopped early. Tighten the arm-only controller goal checks so a
      # partial stop is more likely to surface as a failure than a false success.
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      joint_1: {trajectory: 0.10, goal: 0.03}
      joint_2: {trajectory: 0.10, goal: 0.03}
      joint_3: {trajectory: 0.10, goal: 0.03}
      joint_4: {trajectory: 0.10, goal: 0.03}
      joint_5: {trajectory: 0.10, goal: 0.03}
      joint_6: {trajectory: 0.10, goal: 0.03}
      joint_7: {trajectory: 0.10, goal: 0.03}
